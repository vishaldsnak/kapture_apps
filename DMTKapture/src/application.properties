# from Kapture. Leave BLANK to use the real iv-user header only.
wsl.default.user=gauravb

# Kapture REST API
kapture.api.base=https://mgssdev.kapturekm.com
kapture.api.login.path=/kauthor-api/cms-check
kapture.api.email=gauravb@softclouds.com
kapture.api.password=z'zC6C3a}H
kapture.api.appType=kauthor
kapture.api.publicIp=60.243.168.29
kapture.api.userAgent=chrome
kapture.api.connect.timeout.ms=30000
kapture.api.read.timeout.ms=120000
# Create / update of documents. One request can take minutes, so it has its own read timeout.
# A request that times out is NOT sent again - the server may still be processing it.
kapture.api.bulk.create.path=/kauthor-api/api/v1/bulk-article-import
kapture.api.bulk.update.path=/kauthor-api/api/v1/bulk-article-import/updates
kapture.api.bulk.read.timeout.ms=600000
# Read of the latest version of one document (used when an update changes only some attributes).
kapture.api.latest.path=/kauthor-api/latest-article
# PDF and other file attributes are uploaded here first, then referenced from the document.
kapture.api.attachment.upload.path=/kauthor-api/api/temp-attachment/upload
# Unpublish of one document - used by the delete processing. Nothing else in the document changes.
kapture.api.unpublish.path=/kauthor-api/unpublish-this-versions
kapture.api.unpublish.mode=SINGLE
# Publish Content job: publishes the latest (draft) version of documents - nothing of the content is sent again.
# One request per channel and locale, publish.batch.size documents each.
kapture.api.publish.path=/kauthor-api/author/bulk/apply-actions
kapture.api.publish.action=PUBLISH_DOCUMENTS
publish.batch.size=50
# Categories - one category for one locale per call. Used by the master data load.
kapture.api.category.create.path=/kauthor-api/add-categoryMgt
kapture.api.category.update.path=/kauthor-api/updateCategoryByCatRef
# A created category is read back from k_categories this many times, this far apart, before
# it is reported as not created (Kapture writes it a few seconds after answering).
kapture.category.readback.attempts=4
kapture.category.readback.delay.ms=1500
# Every call to Kapture writes one log line (what was called, HTTP status, time taken, answer).
# The request that was sent is logged as well when the call failed; Y logs it for every call.
# The login call is never logged with its request or answer. Texts are cut at max.chars.
kapture.api.log.payload=N
kapture.api.log.max.chars=4000
# 401 -> log in again and retry this many times.
kapture.api.token.retry.max=1
# 429 / 5xx / no answer -> the whole request is retried this many times, with the delay doubling
# from the base up to the maximum (milliseconds).
kapture.api.retry.max=4
kapture.api.retry.base.delay.ms=1000
kapture.api.retry.max.delay.ms=30000

# Document id prefix of each channel in Kapture (k_content_type.DOCUMENTID_PREFIX). The channel's
# contentId is read from Kapture through it.
kapture.channel.prefix.SERVICE_MANUALS=SM
kapture.channel.prefix.WIRING_DIAGRAMS=WD
kapture.channel.prefix.OTHER_SERVICE_MANUALS=OSM

# Kapture user groups and view given to every document of the MC market (Kapture reference keys).
kapture.usergroups.mc.refkeys=TECHNICIAN_CONTENT_KEY,AFTERMARKET_CONTENT_KEY
kapture.views.mc.refkeys=MC_KEY
# MME: legacy USERGROUPS_MME_REF_KEYS (TECHNICIAN,AFTERMARKET,CORPORATE) and VIEW_MME (MME) as Kapture reference keys
kapture.usergroups.mme.refkeys=TECHNICIAN_CONTENT_KEY,AFTERMARKET_CONTENT_KEY,CORPORATE_CONTENT_KEY
kapture.views.mme.refkeys=MME_KEY
# MNAO: legacy USERGROUPS_REF_KEYS (TECHNICIAN,AFTERMARKET) and VIEW (MNAO) as Kapture reference keys
kapture.usergroups.mnao.refkeys=TECHNICIAN_CONTENT_KEY,AFTERMARKET_CONTENT_KEY
kapture.views.mnao.refkeys=MNAO_KEY

# k_article.article_state values.
kapture.article.state.published=Published
kapture.article.state.unpublished=Unpublished

# Markup Kapture rejects - removed from the HTML of a document before it is sent.
kapture.sanitize.strip.tags=meta,script,iframe,object,embed,link
kapture.sanitize.strip.attributes=onclick,onload,onerror
kapture.sanitize.strip.all.event.attributes=TRUE
kapture.sanitize.strip.url.schemes=javascript,vbscript

###################################
####- VIEW CONTENT STATUS (vc_content_status) -###
###################################
# Written to the vc_content_status column of the view content tables.
# DMT writes the DRAFT value; the Publish Content job changes it to the PUBLISHED value.
view.content.status.draft=Draft
view.content.status.published=Published

# The source location (path of the Settings page) holds two folders side by side: the content
# (market folders) and the master data Excel files. The Settings path may point at the location
# holding both folders or at the content folder itself.
source.content.folder.name=GMS3_Content
source.masterdata.folder.name=MDM
# Master data Excel files (<country>_<locale>_<type>.xlsx): sheet read, and the header of the
# last column, which carries A (add) / U (update) / D (delete).
masterdata.sheet.name=EXPORTED DATA
masterdata.indicator.column=Indicator

####- DATABASE LOOKUPS -###
# Every statement is a network round trip, so bigger batches mean fewer of them.
# Documents looked up in ONE query (display order, CD processing).
db.lookup.batch.size=500
# Rows written per batch (view content, display order temp, categories, VINs, inner links). With
# rewriteBatchedStatements=true on the datasource one batch goes to MySQL as ONE statement; the
# driver splits it by itself if it would exceed the server's max_allowed_packet.
db.write.batch.size=500

####- KAPTURE ATTACHMENT UPLOADS -###
# Attachments (PDF) of a batch are uploaded several per request, at most this many files and bytes
# - the bulk content import job's limits (requests of 15 files or more bounced). A refused request
# is halved until single files are left; a file larger than the byte limit goes on its own.
kapture.attachment.upload.max.files=10
kapture.attachment.upload.max.bytes=8388608

####- KAPTURE BULK REQUESTS -###
# Documents are written to Kapture several per request, closed by whichever limit is reached
# first - the same limits as the bulk content import job (Job 10). A document that alone is
# larger than the byte limit is failed, never truncated. 1 = one document per request.
kapture.bulk.max.articles.per.request=100
# 80 MiB, about 80% of the 100 MiB request body Kapture accepts.
kapture.bulk.max.request.bytes=83886080

####- OKASSETS WEB ACCESS -###
# Web context the OKAssets folder (SERVER_OKASSETS_PHYSICAL_PATH) is served under. Every /library/...
# path DMT gives to the BROWSER (report downloads, e-mail links, preview pages) is prefixed with it:
# /library/MAZDA/... -> /content/library/MAZDA/... Paths sent to Kapture inside documents are NOT.
okassets.web.context=/content

####- CONTENT PREVIEW -###
# Each MC job writes an offline copy of the documents it wrote to Kapture (one HTML page per
# document, PDF copies and preview.json = the tree and carline / VIN filters) into
# <preview.physical.path><schedule id>/. The Preview page reads only these files.
# preview.web.path is the same folder as the browser sees it (okassets.web.context is put in front).
preview.physical.path=D:/WD/Kapture_WD/SourceContent/okassetsdev/content/library/MAZDA/GMS3_CUSTOM/DMT_PREVIEW/
preview.web.path=/library/MAZDA/GMS3_CUSTOM/DMT_PREVIEW/
