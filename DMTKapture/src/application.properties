# Other manual links (InfoManager search links index?page=result_mc&startover=y&qstr=qstr&fac=...&question_box=X)
# -> Kapture search links (result_mc?question_box=X). Same rules as the SEARCH rules of the bulk content
# import job (Job 10): ordered, first match wins; {name} = that query parameter of the source link, the
# rest (startover, qstr, fac) is dropped. Each match keeps its trailing & - page=result is a prefix of the others.
OTHER_MANUAL_LINK_RULES=result_mme,result_mc,result
OTHER_MANUAL_LINK_RULE.result_mme.match=index?page=result_mme&
OTHER_MANUAL_LINK_RULE.result_mme.target=result_mme?question_box={question_box}
OTHER_MANUAL_LINK_RULE.result_mc.match=index?page=result_mc&
